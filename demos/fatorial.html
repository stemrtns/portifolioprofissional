<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <title>Calculadora de Fatorial — Stefânia Alves Martins</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #293126;
      background: #10110f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 560px);
      padding: clamp(22px, 6vw, 42px);
      border: 8px solid #242522;
      border-radius: 14px;
      background: #bdcbae;
      box-shadow: 0 18px 55px #0008;
    }

    a { color: inherit; }

    .eyebrow {
      margin: 0 0 10px;
      font: 700 0.8rem monospace;
      letter-spacing: 0.08em;
    }

    h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 6vw, 2.4rem); }
    p { line-height: 1.55; }

    form { display: grid; gap: 12px; margin-top: 24px; }

    label { font-weight: 700; }

    input, button {
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid #718067;
      border-radius: 5px;
      font: inherit;
    }

    input { width: 100%; background: #dce4d2; }

    button {
      border-color: #947600;
      background: #f5cf37;
      color: #20231e;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #ffdb43; }
    :focus-visible { outline: 3px solid #3d572f; outline-offset: 3px; }

    #resultado {
      min-height: 2em;
      overflow-wrap: anywhere;
      font-weight: 700;
    }
  </style>
  <script src="fatorial.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">PROJETO ACADÊMICO · HTML / CSS / JAVASCRIPT</p>
    <h1>Calculadora de Fatorial</h1>
    <p>Informe um número inteiro entre 0 e 2000. A demonstração valida a entrada e calcula o resultado sem usar <code>eval</code>.</p>
    <form id="form-fatorial">
      <label for="numero">Número</label>
      <input id="numero" name="numero" type="number" min="0" max="2000" step="1" required inputmode="numeric">
      <button type="submit">Calcular fatorial</button>
    </form>
    <p id="resultado" role="status" aria-live="polite"></p>
    <a href="../index.html#projetos">Voltar ao portfólio</a>
  </main>
</body>
</html>
