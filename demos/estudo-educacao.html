<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <title>Estudo sobre o Ensino Superior — Stefânia Alves Martins</title>
  <link rel="stylesheet" href="project-pages.css">
  <script src="project-pages.js" defer></script>
</head>
<body>
  <main>
    <div class="toolbar">
      <p class="eyebrow">ESTUDO ACADÊMICO · ANÁLISE EXPLORATÓRIA</p>
      <div class="language-buttons" role="group" aria-label="Idioma">
        <button type="button" data-language="pt" aria-pressed="true">PT</button>
        <button type="button" data-language="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <h1 data-pt="Ensino superior: permanência e oferta de vagas" data-en="Higher education: student retention and course availability"></h1>
    <p data-pt="Este trabalho acadêmico explora questões sobre a permanência de estudantes no ensino superior noturno e a distribuição de vagas em Barão de Monte Alto, Minas Gerais." data-en="This academic project explores student retention in evening higher education and the distribution of course seats in Barão de Monte Alto, Minas Gerais."></p>

    <section class="panel">
      <h2 data-pt="O problema estudado" data-en="Research questions"></h2>
      <ul>
        <li data-pt="O relatório aponta evasão e conclusão mais baixa no período noturno." data-en="The report points to higher dropout and lower completion in evening courses."></li>
        <li data-pt="Também discute diferenças entre oferta de vagas e procura por cursos." data-en="It also discusses mismatches between available seats and demand across courses."></li>
      </ul>
    </section>

    <section class="panel" aria-labelledby="findings-title">
      <h2 id="findings-title" data-pt="Indicadores anotados no relatório" data-en="Indicators reported in the study"></h2>
      <p class="muted" data-pt="Os números abaixo são transcritos do relatório local; esta página não recalcula nem valida os microdados originais." data-en="The figures below are transcribed from the local report; this page does not recalculate or validate the original microdata."></p>
      <div class="bar-row">
        <span data-pt="Conclusão · noturno" data-en="Completion · evening"></span>
        <div class="bar-track" role="img" aria-label="25%"><div class="bar-fill" style="width:25%"></div></div>
        <strong>~25%</strong>
      </div>
      <div class="bar-row">
        <span data-pt="Conclusão · diurno" data-en="Completion · daytime"></span>
        <div class="bar-track" role="img" aria-label="40%"><div class="bar-fill highlight" style="width:40%"></div></div>
        <strong>~40%</strong>
      </div>
      <div class="bar-row">
        <span data-pt="Evasão · noturno" data-en="Dropout · evening"></span>
        <div class="bar-track" role="img" aria-label="45%"><div class="bar-fill" style="width:45%"></div></div>
        <strong>~45%</strong>
      </div>
      <p data-pt="O documento também informa ocupação média de vagas de 85%, cursos com procura acima de 100% e outros abaixo de 50%." data-en="The document also reports average seat occupancy of 85%, with some courses above 100% demand and others below 50%."></p>
    </section>

    <section class="panel grid">
      <div>
        <h2 data-pt="Fonte e recorte" data-en="Source and scope"></h2>
        <p data-pt="O documento identifica microdados do Ministério da Educação, período de 2001 a 2008, e informa o código municipal 310350. As planilhas de origem permanecem no computador e não são expostas nesta página." data-en="The document identifies Ministry of Education microdata from 2001 to 2008 and lists municipal code 310350. The source spreadsheets remain on the local computer and are not exposed on this page."></p>
      </div>
      <div>
        <h2 data-pt="Público e aplicação" data-en="Audience and potential use"></h2>
        <p data-pt="O estudo pode apoiar conversas sobre permanência estudantil, planejamento de vagas e identificação de necessidades de estudantes trabalhadores. Os achados são exploratórios e não demonstram causalidade." data-en="The study can inform discussions about student retention, seat planning, and the needs of working students. Findings are exploratory and do not establish causation."></p>
      </div>
    </section>
    <p class="notice" data-pt="Uma continuação possível seria documentar o tratamento dos dados, as fórmulas dos indicadores e as limitações antes de usar os resultados em decisões públicas." data-en="A useful next step would be to document data cleaning, indicator formulas, and limitations before using the findings for public decisions."></p>
    <a class="back-link" href="../index.html#projetos" data-pt="Voltar ao portfólio" data-en="Back to portfolio"></a>
  </main>
</body>
</html>
